<div class="mb-3">
    <label class="form-label fw-bold">Valor do Empréstimo</label>
    <div class="input-group">
        <span class="input-group-text">R$</span>
        <input type="text" id="loanAmount" class="form-control form-control-lg" placeholder="0,00" oninput="formatCurrency(this)">
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// 1. MÁSCARA DE MOEDA EM TEMPO REAL
function formatCurrency(input) {
    let value = input.value.replace(/\D/g, "");
    value = (value / 100).toFixed(2) + "";
    value = value.replace(".", ",");
    value = value.replace(/(\d)(\d{3})(\d{3})/, "$1.$2.$3");
    value = value.replace(/(\d)(\d{3})/, "$1.$2");
    input.value = value;
    
    // Calcular automaticamente ao digitar
    calculateLoan();
}

// 2. CÁLCULO PROFISSIONAL (TABELA PRICE)
function calculateLoan() {
    const displayResult = document.getElementById('installmentResult');
    
    // Tratamento do valor (converte "1.500,00" em 1500.00)
    let rawValue = document.getElementById('loanAmount').value.replace(/\./g, "").replace(",", ".");
    let principal = parseFloat(rawValue);
    
    let interestRate = 0.045; // Taxa média de 4.5% a.m. (Ajuste conforme o parceiro)
    let term = parseInt(document.getElementById('loanTerm').value) || 12;

    if (principal > 0) {
        // Fórmula de Parcelas Fixas
        let x = Math.pow(1 + interestRate, term);
        let monthly = (principal * x * interestRate) / (x - 1);
        let totalPayment = monthly * term;
        let totalInterest = totalPayment - principal;

        // Atualiza o texto
        displayResult.innerHTML = `R$ ${monthly.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

        // 3. ATUALIZAÇÃO DO GRÁFICO
        updateChart(principal, totalInterest);
    }
}

let loanChart;
function updateChart(capital, juros) {
    const ctx = document.getElementById('loanChart').getContext('2d');
    
    if (loanChart) { loanChart.destroy(); }
    
    loanChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Capital solicitado', 'Juros totais'],
            datasets: [{
                data: [capital, juros],
                backgroundColor: ['#ffc107', '#212529'],
                borderWidth: 0
            }]
        },
        options: {
            plugins: {
                legend: { position: 'bottom' }
            },
            cutout: '70%'
        }
    });
}
</script>
