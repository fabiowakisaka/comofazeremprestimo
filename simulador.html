<script>
document.addEventListener('DOMContentLoaded', function() {
    const formatter = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
    let chart = null;

    document.getElementById('calcular').addEventListener('click', function() {
        let valor = parseFloat(document.getElementById('valor').value.replace(/\./g, '').replace(',', '.')) || 0;
        let prazo = parseInt(document.getElementById('prazo').value) || 0;
        let taxaMensal = parseFloat(document.getElementById('taxa').value.replace(',', '.')) / 100 || 0;

        if (valor <= 0 || prazo <= 0 || taxaMensal <= 0) {
            alert("Por favor, preencha os dados corretamente.");
            return;
        }

        // LÓGICA TABELA PRICE (Parcelas Fixas)
        // Fórmula: P = V * [ (i * (1 + i)^n) / ((1 + i)^n - 1) ]
        let parcela = valor * (taxaMensal * Math.pow(1 + taxaMensal, prazo)) / (Math.pow(1 + taxaMensal, prazo) - 1);
        let totalPago = parcela * prazo;
        let totalJuros = totalPago - valor;

        // Mostrar Resultados
        document.getElementById('resultado').style.display = 'block';
        document.getElementById('resultado-texto').innerHTML = `
            <div class="row text-center mt-3">
                <div class="col-md-6 mb-3">
                    <small class="text-uppercase text-muted d-block">Parcela Mensal Fixa</small>
                    <h3 class="fw-bold text-primary">${formatter.format(parcela)}</h3>
                </div>
                <div class="col-md-6 mb-3">
                    <small class="text-uppercase text-muted d-block">Total Final com Juros</small>
                    <h3 class="fw-bold text-dark">${formatter.format(totalPago)}</h3>
                </div>
            </div>
            <p class="text-center fs--1 text-secondary mt-2">Você pagará <strong>${formatter.format(totalJuros)}</strong> apenas em juros nesta simulação.</p>
        `;

        // INJEÇÃO FUNDO DE FUNIL (Onde o lucro acontece)
        let recomendacaoHTML = "";
        if (taxaMensal > 0.03) { // Se juros > 3% a.m.
            recomendacaoHTML = `
                <div class="alert bg-soft-warning border-warning p-4 mt-4 animate-in">
                    <h5 class="fw-bold"><i class="fas fa-magic me-2"></i> Encontramos taxas menores para você!</h5>
                    <p class="small text-dark">Sua simulação está com juros de mercado aberto. Se você tem <strong>FGTS</strong> ou é <strong>Aposentado</strong>, pode pagar até 60% menos juros.</p>
                    <div class="d-grid gap-2 d-md-flex">
                        <a href="pages/fies.html" class="btn btn-warning btn-sm fw-bold">ANTECIPAR FGTS (Taxas de 1.49%)</a>
                        <a href="pages/emprestimo-consignado.html" class="btn btn-outline-dark btn-sm fw-bold">VER CONSIGNADO</a>
                    </div>
                </div>`;
        } else {
            recomendacaoHTML = `
                <div class="alert bg-soft-success border-success p-4 mt-4 animate-in">
                    <h5 class="fw-bold"><i class="fas fa-check-circle me-2"></i> Ótima escolha de crédito!</h5>
                    <p class="small text-dark">Essas taxas são competitivas. Que tal simular agora com nossos parceiros oficiais para garantir essa aprovação?</p>
                    <a href="pages/emprestimo-para-negativados.html" class="btn btn-success btn-sm fw-bold">SOLICITAR APROVAÇÃO AGORA</a>
                </div>`;
        }
        document.getElementById('resultado-texto').innerHTML += recomendacaoHTML;

        // Gráfico de Evolução (Saldo Devedor decrescente - Mais intuitivo)
        const labels = [];
        const dadosGrafico = [];
        let saldoDevedor = totalPago;
        for (let i = 0; i <= prazo; i++) {
            labels.push(`Mês ${i}`);
            dadosGrafico.push(saldoDevedor);
            saldoDevedor -= parcela;
        }

        const ctx = document.getElementById('grafico').getContext('2d');
        if (chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Sua dívida diminuindo mensalmente',
                    data: dadosGrafico,
                    borderColor: '#198754',
                    backgroundColor: 'rgba(25, 135, 84, 0.1)',
                    fill: true,
                    tension: 0.3
                }]
            }
        });
    });
});
</script>
