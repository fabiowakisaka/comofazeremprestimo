name: Publicar Dica Financeira com Slug

on:
  schedule:
    - cron: '30 6 * * *' # Todo dia às 03:30 (Horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-dica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar biblioteca do Gemini
        run: pip install google-genai

      - name: Rodar script gerador de dicas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gerador.py

      - name: Salvar e enviar páginas no repositório
        run: |
          git config --global user.name "Bot Empréstimo Dicas"
          git config --global user.email "bot@comofazeremprestimo.com"
          git pull --rebase origin main || true
          git add -A
          git diff --staged --quiet || (git commit -m "Publicação de dica financeira por slug automática" && git push)
